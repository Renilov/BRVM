name: Scraping Quotidien BRVM

on:
  schedule:
    # Du lundi au vendredi à 17h30 UTC (après la clôture BRVM)
    - cron: '30 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du scraper
        run: python scraper.py

      - name: Envoi des alertes Telegram
        run: python alerts.py

      - name: Sauvegarde de la base de données SQLite
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add brvm.db
          git commit -m "Mise à jour automatique de la base $(date +'%Y-%m-%d')" || exit 0
          git push