name: BRVM Daily Scraper & Telegram Alerts

on:
  schedule:
    # S'exécute du Lundi au Vendredi à 16h30 UTC (heure de clôture BRVM)
    - cron: '30 16 * * 1-5'
  workflow_dispatch: # Permet de lancer le robot manuellement depuis GitHub en 1 clic

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du Scraper et Envoi des Alertes Telegram
        run: python scraper.py