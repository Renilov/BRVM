name: BRVM Daily Scraper & Telegram Alerts

on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Extraction du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Exécution du scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scraper.py

      - name: Sauvegarde automatique de la base de données
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.db data/*.db 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Mise à jour des cours BRVM [skip ci]" && git push)